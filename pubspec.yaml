name: circumfit_v3
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: '>=2.19.4 <4.0.0'

dependencies:
  tflite_flutter: ^0.11.0
  flutter:
    sdk: flutter

  english_words: ^4.0.0
  provider: ^6.0.0
  
  camera: 0.11.0+2
  image_picker: 1.1.2
  http: ^1.2.2
  flutter_launcher_icons: ^0.14.0
  sensors_plus: ^7.1.1
  image: ^4.12.0
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

dependency_overrides:
  camera_android_camerax: 0.6.10+3
  flutter_plugin_android_lifecycle: 2.0.24
  image_picker_android: 0.8.12+19

flutter:
  uses-material-design: true
  assets :
    - assets/logo1.png
    - assets/logo.png
    - assets/body_image.png
    - assets/logo_polytech.png
    - assets/logo_lba.png
    - assets/posenet.tflite

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/icon.png"
  remove_alpha_ios: true